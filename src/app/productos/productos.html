@for (producto of productos; track producto.id){
    
    <div class="productos">
        <h3>{{producto.nombre}}</h3>
        <h3>{{producto.precio}}</h3>
        @if(producto.stock > 0) {
            <p>Producto Dispinible</p>
        } @else{
            <p>Producto Agotado</p>
        }
    </div>
}
